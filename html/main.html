<!DOCTYPE html>
<html>
    <head>
        <!--  -->
        <title>Monostax Revenue Center - {{applicationName}}</title>
        <script type="application/json" data-name="loader-params">
            {{loaderParams}}
        </script>
        {{scriptsHtml}}
        <link
            rel="stylesheet"
            href="{{basePath}}{{stylesheet}}?r={{assetVersion}}"
            id="main-stylesheet"
        />
        {{additionalStyleSheetsHtml}}{{linksHtml}}
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <meta content="utf-8" http-equiv="encoding" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="description" content="{{applicationDescription}}" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <link
            rel="alternate icon"
            href="{{basePath}}{{faviconAlternate}}"
            type="image/x-icon"
        />
        <link
            rel="icon"
            href="{{basePath}}{{favicon}}"
            type="{{faviconType}}"
        />
        <script nonce="{{nonce}}">
            let loadedApp;
            let initializing = false;

            const run = app => {
                {{runScript}}
            };

            const init = () => {
                if (initializing) return;
                initializing = true;

                require('{{appClientClassName}}', App => {
                    new App({
                        id: '{{applicationId}}',
                        useCache: {{useCache}},
                        cacheTimestamp: {{cacheTimestamp}},
                        appTimestamp: {{appTimestamp}},
                        assetVersion: {{assetVersionJson}},
                        basePath: '{{basePath}}',
                        apiUrl: '{{apiUrl}}',
                        ajaxTimeout: {{ajaxTimeout}},
                        internalModuleList: {{internalModuleList}},
                        bundledModuleList: {{bundledModuleList}},
                        theme: {{theme}},
                    }, app => {
                        loadedApp = app;

                        run(app);
                    });
                });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init, {once: true});
            } else {
                init();
            }

            window.addEventListener('pageshow', event => {
                if (event.persisted && loadedApp) {
                    run(loadedApp);
                }
            });
        </script>
    </head>
    <body data-id="{{applicationId}}">
        <div class="container content"></div>
        <footer>
            <p class="credit small">
                &copy; 2025
                <a
                    href="https://www.monostax.ai"
                    title="Monostax Revenue Center"
                    rel="noopener"
                    target="_blank"
                    >Monostax Revenue Center</a
                >
            </p>
        </footer>
    </body>
</html>
